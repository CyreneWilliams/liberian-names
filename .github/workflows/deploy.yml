# Publishes the site to Cloudflare every time something changes on the main branch.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions).
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 50969c08cd41e49bd357a2bebbb4cfcb
